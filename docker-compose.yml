# 内网 Ubuntu 服务器部署。
#
# 镜像分三层，只有第一次需要从外网带进来：
#   synthetix-app:1.1.0    运行时底座：Node + Python + 模型 + 现有构建产物
#   synthetix-base:1.1.0   构建底座：Node + 全部 npm 依赖（含构建期依赖）
#   synthetix-app:<新版本>  内网 docker build 出来的应用镜像（薄薄一层代码）
#
# 首次在服务器上执行：
#   docker load -i synthetix-app-1.1.0.tar
#   docker load -i synthetix-base-1.1.0.tar
#   把源码放到本目录（不含 node_modules/.next/offline）
#   cp deploy/synthetix.env.example deploy/synthetix.env   # 然后填入密钥
#   docker build -t synthetix-app:1.1.1 .
#   SYNTHETIX_VERSION=1.1.1 docker compose up -d --no-build
#
# 以后每次改代码：
#   1. 把源码同步到本目录
#   2. docker build -t synthetix-app:1.1.2 .
#   3. SYNTHETIX_VERSION=1.1.2 docker compose up -d --no-build
#
# 浏览器直接访问 :3000，本栈里没有 nginx。
# 主项目 Vue3 页面用 iframe 嵌入时，地址必须和主页面同 host，
# 例如 http://<服务器>:3000/；这样 SameSite=Strict 的登录 Cookie 仍属同站，
# 登录流程才正常。iframe 里换成别的主机名或 IP 会让 Cookie 变成第三方 Cookie，
# 表现为登录成功后又被踢回 /login。

name: synthetix

# 运行时环境变量(PORT、数据目录、COOKIE_SECURE、模型路径等)已由
# 运行时底座镜像的 ENV 写死,这里不再重复。
# deploy/synthetix.env 只放运行时注入的密钥。

services:
  app:
    # 默认跑内网构建出的版本；回滚时把 SYNTHETIX_VERSION 改成旧 tag 即可。
    image: ${SYNTHETIX_IMAGE:-synthetix-app}:${SYNTHETIX_VERSION:-1.1.1}
    build:
      context: .
      # 薄构建：FROM synthetix-base + FROM synthetix-app，完全离线。
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # 主页面里的 iframe 由浏览器直接连这里。
      # 如果宿主机 3000 已被占用,改成 "8080:3000" 即可。
      - "3000:3000"
    env_file:
      - ./deploy/synthetix.env
    volumes:
      # 持久化数据:dev.db、上传的文档、RAG 索引、锁文件。
      # 不想用宿主机目录的话可以换成命名卷。
      - /srv/synthetix/data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
