server {
    listen 80;
    server_name _;

    # Document uploads. App-side limit is 200MB (next.config.ts
    # experimental.proxyClientMaxBodySize); nginx's default is 1m.
    client_max_body_size 200m;

    # Docling conversion runs inside the upload request and can take many
    # minutes for large PDFs; the default 60s would return 504 mid-conversion.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Allow streamed responses (LLM output) to reach the browser unbuffered.
        proxy_buffering off;
    }
}
